name: Build editor
description: >
  Build the metadata editor image with Bazel (`//areas/deposit/server:image`) and load it into
  Docker as `local-scan/editor:latest`, the tag the Scout scan reads. The build is stamped: the
  footer shows `DEPOSIT_VERSION` from the calling step's environment, `dev` when it is unset.

inputs:
  rbe-runner-endpoint:
    description: RE-API endpoint, `vars.REMOTEBUILD_RUNNER_ENDPOINT`.
  rbe-ca-cert:
    description: NativeLink server CA, `secrets.REMOTEBUILD_CA_CERT`.
  rbe-client-cert:
    description: mTLS client certificate, `secrets.REMOTEBUILD_CLIENT_CERT`.
  rbe-client-key:
    description: mTLS client key, `secrets.REMOTEBUILD_CLIENT_KEY`.

runs:
  using: composite
  steps:
    - id: bazel
      uses: ./.github/actions/bazel-setup
      with:
        rbe-runner-endpoint: ${{ inputs.rbe-runner-endpoint }}
        rbe-ca-cert: ${{ inputs.rbe-ca-cert }}
        rbe-client-cert: ${{ inputs.rbe-client-cert }}
        rbe-client-key: ${{ inputs.rbe-client-key }}

    - name: just bazel-docker-build-editor
      shell: bash
      run: just bazel-docker-build-editor ${{ steps.bazel.outputs.flags }}

    - name: Save Bazel repository cache
      if: ${{ !cancelled() && steps.bazel.outputs.repo-cache-key != '' && steps.bazel.outputs.repo-cache-hit != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: ~/.cache/bazel-repo
        key: ${{ steps.bazel.outputs.repo-cache-key }}
