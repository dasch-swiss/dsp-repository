name: a11y / dpe

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      # Any DPE crate (server/core/api-oai/web), styles, assets, or the e2e suite —
      # a server-side render change must trigger the a11y job too. `shared/**`
      # covers the shared crates DPE renders through.
      - "areas/access/dpe/**"
      - "areas/access/server/**"
      - "shared/**"
  pull_request:
    paths:
      - "areas/access/dpe/**"
      - "areas/access/server/**"
      - "shared/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  a11y:
    runs-on: ubuntu-latest
    name: a11y / dpe / WCAG 2.1 AA
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web-e2e-tests dependencies
        run: cd areas/access/dpe/web-e2e-tests && npm install

      - name: Install Playwright browsers
        run: cd areas/access/dpe/web-e2e-tests && npx playwright install chromium --with-deps

      - name: Build access-server and stylesheet
        # `cargo build -p access-server --release` yields target/release/access-server
        # directly (the [[bin]] name), which the Playwright webServer launches.
        # `just css-release` builds the content-hashed app.css the release server
        # discovers from areas/access/dpe/public/assets at startup.
        run: |
          cargo build -p access-server --release
          just css-release

      - name: Run accessibility tests
        run: just test-a11y-dpe

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-a11y-dpe
          path: areas/access/dpe/web-e2e-tests/playwright-report/
          retention-days: 7
