name: a11y / dpe

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      # Any DPE crate (server/core/api-oai/web), styles, assets, or the e2e suite —
      # a server-side render change must trigger the a11y job too. `shared/**`
      # covers the shared crates DPE renders through. CPE, `sync` and `media` are
      # built into the same binary, so a change there must not break the server
      # the suite starts; the suite tests DPE's pages only.
      - "areas/access/dpe/**"
      - "areas/access/server/**"
      - "areas/access/cpe/**"
      - "areas/access/sync/**"
      - "areas/access/media/**"
      - "shared/**"
      - "modules/mosaic/tiles/**"
      # The Bazel build: what it reads besides the sources above.
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - "Cargo.Bazel.lock"
      - ".bazelrc"
      - ".bazelversion"
      - "platforms/**"
      - "bazel/**"
      - "tools/**"
      - ".github/actions/bazel-setup/**"
      - ".github/actions/bazel-rbe/**"
  pull_request:
    paths:
      - "areas/access/dpe/**"
      - "areas/access/server/**"
      - "areas/access/cpe/**"
      - "areas/access/sync/**"
      - "areas/access/media/**"
      - "shared/**"
      - "modules/mosaic/tiles/**"
      # The Bazel build: what it reads besides the sources above.
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - "Cargo.Bazel.lock"
      - ".bazelrc"
      - ".bazelversion"
      - "platforms/**"
      - "bazel/**"
      - "tools/**"
      - ".github/actions/bazel-setup/**"
      - ".github/actions/bazel-rbe/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  a11y:
    # Playwright 1.58.2 cannot install Chromium on ubuntu 26.04, which ubuntu-latest became.
    runs-on: ubuntu-24.04
    name: a11y / dpe / WCAG 2.1 AA
    steps:
      - uses: actions/checkout@v4

      - name: Bazel setup
        id: bazel
        uses: ./.github/actions/bazel-setup
        with:
          rbe-runner-endpoint: ${{ vars.REMOTEBUILD_RUNNER_ENDPOINT }}
          rbe-ca-cert: ${{ secrets.REMOTEBUILD_CA_CERT }}
          rbe-client-cert: ${{ secrets.REMOTEBUILD_CLIENT_CERT }}
          rbe-client-key: ${{ secrets.REMOTEBUILD_CLIENT_KEY }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web-e2e-tests dependencies
        run: cd areas/access/dpe/web-e2e-tests && npm install

      - name: Install Playwright browsers
        run: cd areas/access/dpe/web-e2e-tests && npx playwright install chromium --with-deps

      - name: Run accessibility tests
        # Builds the release server and the release stylesheet with Bazel, then runs the suite;
        # Playwright starts the server from the path the recipe passes.
        run: just test-a11y-dpe ${{ steps.bazel.outputs.flags }}

      - name: Run facet-form E2E tests
        # The facet form with JavaScript on and off (`chromium-no-js`).
        run: just test-e2e-dpe ${{ steps.bazel.outputs.flags }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-a11y-dpe
          path: areas/access/dpe/web-e2e-tests/playwright-report/
          retention-days: 7

      - name: Save Bazel repository cache
        if: ${{ !cancelled() && steps.bazel.outputs.repo-cache-key != '' && steps.bazel.outputs.repo-cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/bazel-repo
          key: ${{ steps.bazel.outputs.repo-cache-key }}
