name: a11y / editor

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      # Any Deposit Area crate (the editor's and identity's), styles, assets, or the e2e suite.
      # `shared/**` covers the shared crates the editor renders
      # through; `modules/mosaic/**` covers the tiles, which own accessibility
      # here — a missing semantic method on a tile is the usual cause of an
      # editor a11y failure, so a mosaic change must trigger this job.
      - "areas/deposit/**"
      - "shared/**"
      - "modules/mosaic/**"
      # The published data set the server reads (EDITOR_DATA_DIR).
      - "areas/access/dpe/server/data/**"
      # The Bazel build: what it reads besides the sources above.
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - "Cargo.Bazel.lock"
      - ".bazelrc"
      - ".bazelversion"
      - "platforms/**"
      - "bazel/**"
      - "tools/**"
      - ".github/actions/bazel-setup/**"
      - ".github/actions/bazel-rbe/**"
  pull_request:
    paths:
      - "areas/deposit/**"
      - "shared/**"
      - "modules/mosaic/**"
      # The published data set the server reads (EDITOR_DATA_DIR).
      - "areas/access/dpe/server/data/**"
      # The Bazel build: what it reads besides the sources above.
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - "Cargo.Bazel.lock"
      - ".bazelrc"
      - ".bazelversion"
      - "platforms/**"
      - "bazel/**"
      - "tools/**"
      - ".github/actions/bazel-setup/**"
      - ".github/actions/bazel-rbe/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  a11y:
    runs-on: ubuntu-latest
    name: a11y / editor / WCAG 2.1 AA + no-JS
    steps:
      - uses: actions/checkout@v4

      - name: Bazel setup
        id: bazel
        uses: ./.github/actions/bazel-setup
        with:
          rbe-runner-endpoint: ${{ vars.REMOTEBUILD_RUNNER_ENDPOINT }}
          rbe-ca-cert: ${{ secrets.REMOTEBUILD_CA_CERT }}
          rbe-client-cert: ${{ secrets.REMOTEBUILD_CLIENT_CERT }}
          rbe-client-key: ${{ secrets.REMOTEBUILD_CLIENT_KEY }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web-e2e-tests dependencies
        run: cd areas/deposit/editor/web-e2e-tests && npm install

      - name: Install Playwright browsers
        run: cd areas/deposit/editor/web-e2e-tests && npx playwright install chromium --with-deps

      - name: Run E2E, accessibility and no-JavaScript tests
        # The whole suite rather than the accessibility spec alone: it runs in
        # two projects, `chromium-js` and `chromium-nojs`, and neither subsumes
        # the other. The no-JS pass catches a control with no submit button
        # behind it; the JS pass catches a control Datastar has made inert.
        # Running only the a11y spec would leave both uncovered in CI. The recipe builds the
        # release server and the release stylesheet with Bazel first.
        run: just test-e2e-editor ${{ steps.bazel.outputs.flags }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-a11y-editor
          path: areas/deposit/editor/web-e2e-tests/playwright-report/
          retention-days: 7

      - name: Save Bazel repository cache
        if: ${{ !cancelled() && steps.bazel.outputs.repo-cache-key != '' && steps.bazel.outputs.repo-cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/bazel-repo
          key: ${{ steps.bazel.outputs.repo-cache-key }}
