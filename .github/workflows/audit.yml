# Advisory scan of the third-party crates Bazel builds (`just audit` over Cargo.Bazel.lock). Not
# part of the required checks: an advisory published overnight must not fail every unrelated pull
# request. It runs daily, on demand, and on pull requests that change the lock.

name: audit

permissions:
  contents: read

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - Cargo.Bazel.lock
      - osv-scanner.toml

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    name: audit
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # `just audit` runs `cargo audit`, a cargo subcommand.
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - name: Install osv-scanner
        run: |
          curl -fsSLo osv-scanner "https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64"
          echo "f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          sudo mv osv-scanner /usr/local/bin/osv-scanner
      - name: just audit
        run: just audit
