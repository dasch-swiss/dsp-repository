# This workflow runs whenever a PR is opened or updated, or a commit is pushed to main. It runs
# several checks:
# - check: `just check`, the gate scripts (vendored-JS checksums among them, see
#   docs/src/security.md), the justfile, maudfmt and pinned nightly rustfmt formatting, and
#   clippy over every Bazel target
# - publish-dry-run: verifies dsp-cli's crates.io packaging with `cargo publish --dry-run`
# - biome: lints the E2E suites' TypeScript
# - docs: builds the mdBook

name: check

permissions:
  contents: read

# This configuration allows maintainers of this repo to create a branch and pull request based on
# the new branch. Restricting the push trigger to the main branch ensures that the PR only gets
# built once.
on:
  push:
    branches: [main]
  pull_request:

# If new code is pushed to a PR branch, then cancel in progress workflows for that PR. Ensures that
# we don't waste CI time, and returns results quicker https://github.com/jonhoo/rust-ci-conf/pull/5
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    name: check
    # Twice the slowest warm Bazel step of this job in Phases 2 to 8 (clippy, 141 s), plus the
    # steps outside Bazel. A cold build (no remote cache: Dependabot, forks, the endpoint down)
    # takes longer.
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # Pinned, not `@nightly`: a new nightly that re-wraps comments turns every open PR red. Only
      # rustfmt: Bazel compiles and lints with its own toolchain.
      - name: Read pinned nightly
        id: nightly
        run: echo "toolchain=$(cat .rustfmt-nightly)" >> "$GITHUB_OUTPUT"
      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.nightly.outputs.toolchain }}
          components: rustfmt
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main
      - name: Install maudfmt
        run: cargo binstall -y maudfmt@0.1.8
      - name: Bazel setup
        id: bazel
        uses: ./.github/actions/bazel-setup
        with:
          rbe-runner-endpoint: ${{ vars.REMOTEBUILD_RUNNER_ENDPOINT }}
          rbe-ca-cert: ${{ secrets.REMOTEBUILD_CA_CERT }}
          rbe-client-cert: ${{ secrets.REMOTEBUILD_CLIENT_CERT }}
          rbe-client-key: ${{ secrets.REMOTEBUILD_CLIENT_KEY }}
      - name: just check
        run: just check ${{ steps.bazel.outputs.flags }}
      - name: Save Bazel repository cache
        if: ${{ !cancelled() && steps.bazel.outputs.repo-cache-key != '' && steps.bazel.outputs.repo-cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/bazel-repo
          key: ${{ steps.bazel.outputs.repo-cache-key }}

  publish-dry-run:
    runs-on: ubuntu-latest
    name: check / publish-dry-run / stable
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
      - name: cargo publish --dry-run
        run: cargo publish -p dsp-cli --dry-run --locked

  lint-e2e:
    runs-on: ubuntu-latest
    name: check / biome / e2e
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lint DPE E2E tests
        run: cd areas/access/dpe/web-e2e-tests && npx @biomejs/biome check .
      - name: Lint Mosaic E2E tests
        run: cd modules/mosaic/playground-e2e-tests && npx @biomejs/biome check .

  docs:
    runs-on: ubuntu-latest
    name: check / docs / stable
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.4.52"
      - name: Install mdBook-alerts
        run: cargo install mdbook-alerts
      - name: Install mdBook-mermaid
        run: cargo install mdbook-mermaid --version 0.16.2
      - name: Generate mermaid assets
        run: mdbook-mermaid install docs
      - run: mdbook build docs
