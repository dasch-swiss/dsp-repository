name: Cloud Run PR Preview for DPE

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "areas/access/dpe/**"
      - "areas/access/server/**"
      - "areas/access/cpe/**"
      - "areas/access/sync/**"
      - "areas/access/media/**"
      - "shared/**"
      - "modules/mosaic/tiles/**"
      # The Bazel build: what it reads besides the sources above.
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - "Cargo.Bazel.lock"
      - ".bazelrc"
      - ".bazelversion"
      - "platforms/**"
      - "bazel/**"
      - "tools/**"
      - ".github/actions/docker-publish/**"
      - ".github/actions/bazel-setup/**"
      - ".github/actions/bazel-rbe/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # Required for Workload Identity Federation (OIDC token request)
  pull-requests: write

concurrency:
  group: cloud-run-dpe-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SERVICE_NAME: dpe-pr-${{ github.event.pull_request.number }}
  IMAGE_TAG: pr-${{ github.event.pull_request.number }}

jobs:
  # --------------------------------------------------------------------------
  # Build and push the image with Bazel and deploy it to Cloud Run.
  # --------------------------------------------------------------------------
  deploy-preview:
    name: Deploy DPE preview
    # Dependabot PRs are skipped because GitHub does not pass repository secrets
    # to workflows triggered by `dependabot[bot]`, so the GCP auth would fail.
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # crane, which `oci_push` runs, takes the credential helper this configures.
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      # Bazel builds the image and pushes it. The pull request's own build, so it may take
      # results from the remote cache.
      - name: Build and push image
        uses: ./.github/actions/docker-publish
        with:
          target: //areas/access/server:image_push
          repository: ${{ secrets.GCP_ARTIFACT_REGISTRY }}/dpe
          tag: ${{ env.IMAGE_TAG }}
          trust-remote-cache: "true"
          rbe-runner-endpoint: ${{ vars.REMOTEBUILD_RUNNER_ENDPOINT }}
          rbe-ca-cert: ${{ secrets.REMOTEBUILD_CA_CERT }}
          rbe-client-cert: ${{ secrets.REMOTEBUILD_CLIENT_CERT }}
          rbe-client-key: ${{ secrets.REMOTEBUILD_CLIENT_KEY }}

      # No CPU throttling: CPE loads its projects after the port is bound, and a
      # throttled instance gets CPU only while it handles a request, so `/cpe`
      # would answer 503 until enough requests had arrived.
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ secrets.GCP_REGION }}
          image: ${{ secrets.GCP_ARTIFACT_REGISTRY }}/dpe:${{ env.IMAGE_TAG }}
          flags: >-
            --port=8080
            --allow-unauthenticated
            --cpu=1
            --memory=512Mi
            --max-instances=1
            --no-cpu-throttling

      # A second step, not a flag on the deploy: Cloud Run assigns the service
      # URL when the service is created, so it cannot be passed to the call that
      # creates it. One extra revision on an ephemeral preview is the right
      # price for identifiers that are absolute and self-consistent.
      #
      # All three variables default to production, and each one left unset makes
      # the preview advertise a deployment that does not carry the branch's code:
      #
      #   DPE_PUBLIC_BASE_URL       every `describedby` link, every JSON-LD URL
      #                             and the `303` target — which answer 404 on
      #                             production.
      #   DPE_OAI_BASE_URL          the OAI `baseURL` and every `<request>`
      #                             echo, so a harvester told where to harvest
      #                             is told production.
      #   DPE_ARK_RESOLVER_BASE_URL every emitted ARK, so an assessor that
      #                             dereferences the identifier it just
      #                             harvested lands on production and assesses
      #                             something else. It also mounts the
      #                             preview's own `/ark:/` resolver, which is
      #                             what makes those ARKs answer.
      #
      # The reported URL is an origin with an https scheme and no trailing
      # slash, which is what `validate_origin` requires, so it is passed through
      # unmodified. `DPE_OAI_BASE_URL` legitimately carries a path and is the
      # one of the three that gets a suffix.
      - name: Point the preview at its own URL
        run: |
          gcloud run services update "$SERVICE_NAME" \
            --region="${{ secrets.GCP_REGION }}" \
            --update-env-vars="DPE_PUBLIC_BASE_URL=${{ steps.deploy.outputs.url }},DPE_OAI_BASE_URL=${{ steps.deploy.outputs.url }}/dpe/oai,DPE_ARK_RESOLVER_BASE_URL=${{ steps.deploy.outputs.url }}" \
            --quiet

      - name: Find existing preview comment
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "<!-- dpe-preview -->"

      - name: Post or update preview URL comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            <!-- dpe-preview -->
            ### DPE Preview

            | | |
            |---|---|
            | **Preview URL** | ${{ steps.deploy.outputs.url }} |
            | **Cloud Run Service** | `${{ env.SERVICE_NAME }}` |
            | **Commit** | ${{ github.event.pull_request.head.sha }} |

            _This preview is updated on every push to this PR._

  # --------------------------------------------------------------------------
  # Clean up Cloud Run service when the PR is closed or merged.
  # --------------------------------------------------------------------------
  cleanup-preview:
    name: Clean up DPE preview
    # Dependabot PRs never deploy a preview, so there is nothing to clean up.
    if: github.event.action == 'closed' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Delete Cloud Run service (if it exists)
        run: |
          gcloud run services delete "$SERVICE_NAME" \
            --region="${{ secrets.GCP_REGION }}" \
            --quiet 2>/dev/null || echo "Service $SERVICE_NAME not found, nothing to clean up."

      - name: Delete container image (if it exists)
        run: |
          gcloud artifacts docker images delete \
            "${{ secrets.GCP_ARTIFACT_REGISTRY }}/dpe:${{ env.IMAGE_TAG }}" \
            --delete-tags --quiet 2>/dev/null || echo "Image not found, nothing to clean up."
