name: Cloud Run PR Preview for editor

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "areas/deposit/**"
      # `shared-*` crates compile into the editor binary, so a change there must
      # rebuild the preview — the editor module glob alone never sees it.
      - "shared/**"
      - "modules/mosaic/tiles/**"
      # DPE's published set, baked into the image as the editor's data directory.
      - "areas/access/dpe/server/data/**"
      # The Bazel build: what it reads besides the sources above.
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - "Cargo.Bazel.lock"
      - ".bazelrc"
      - ".bazelversion"
      - "platforms/**"
      - "bazel/**"
      - "tools/**"
      - ".github/actions/docker-publish/**"
      - ".github/actions/bazel-setup/**"
      - ".github/actions/bazel-rbe/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # Required for Workload Identity Federation (OIDC token request)
  pull-requests: write

concurrency:
  group: cloud-run-editor-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SERVICE_NAME: editor-pr-${{ github.event.pull_request.number }}
  IMAGE_TAG: pr-${{ github.event.pull_request.number }}

jobs:
  # --------------------------------------------------------------------------
  # Build and push the image with Bazel and deploy it to Cloud Run.
  # --------------------------------------------------------------------------
  deploy-preview:
    name: Deploy editor preview
    # Dependabot PRs are skipped because GitHub does not pass repository secrets
    # to workflows triggered by `dependabot[bot]`, so the GCP auth would fail.
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # The footer's version (a stamped build). The head SHA, not HEAD: on
      # pull_request the checkout is a merge commit.
      - name: Set footer version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "DEPOSIT_VERSION=pr-${PR_NUMBER}-${HEAD_SHA::7}" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # crane, which `oci_push` runs, takes the credential helper this configures.
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      # Bazel builds the image and pushes it. The pull request's own build, so it may take
      # results from the remote cache.
      - name: Build and push image
        uses: ./.github/actions/docker-publish
        with:
          target: //areas/deposit/server:image_push
          repository: ${{ secrets.GCP_ARTIFACT_REGISTRY }}/editor
          tag: ${{ env.IMAGE_TAG }}
          trust-remote-cache: "true"
          rbe-runner-endpoint: ${{ vars.REMOTEBUILD_RUNNER_ENDPOINT }}
          rbe-ca-cert: ${{ secrets.REMOTEBUILD_CA_CERT }}
          rbe-client-cert: ${{ secrets.REMOTEBUILD_CLIENT_CERT }}
          rbe-client-key: ${{ secrets.REMOTEBUILD_CLIENT_KEY }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ secrets.GCP_REGION }}
          image: ${{ secrets.GCP_ARTIFACT_REGISTRY }}/editor:${{ env.IMAGE_TAG }}
          # An RDU account so the login flow can actually be signed in to, and
          # nothing else. `EDITOR_SMTP_*` stays unset on purpose: with no relay
          # the code is written to the Cloud Run log, which is not
          # public, so a publicly reachable preview cannot send mail through
          # the shared relay, cannot spend its daily quota, and cannot hand
          # a code to anyone who is not already able to read our logs.
          # `EDITOR_DB_DIR` stays unset too, so the preview's database is
          # in-memory and dies with the revision.
          # DEV, not the image's PROD default: a preview with no relay is
          # exactly the console transport, and startup refuses PROD
          # without one because that combination silently writes every login
          # code to the log while the service looks healthy.
          env_vars: |-
            EDITOR_ENV=DEV
            EDITOR_RDU_EMAILS=editor-preview@dasch.swiss
          flags: >-
            --port=8080
            --allow-unauthenticated
            --cpu=1
            --memory=512Mi
            --max-instances=1
            --cpu-throttling

      - name: Find existing preview comment
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "<!-- editor-preview -->"

      - name: Post or update preview URL comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            <!-- editor-preview -->
            ### Editor Preview

            | | |
            |---|---|
            | **Preview URL** | ${{ steps.deploy.outputs.url }} |
            | **Cloud Run Service** | `${{ env.SERVICE_NAME }}` |
            | **Commit** | ${{ github.event.pull_request.head.sha }} |

            _This preview is updated on every push to this PR._

  # --------------------------------------------------------------------------
  # Clean up Cloud Run service when the PR is closed or merged.
  # --------------------------------------------------------------------------
  cleanup-preview:
    name: Clean up editor preview
    # Dependabot PRs never deploy a preview, so there is nothing to clean up.
    if: github.event.action == 'closed' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Delete Cloud Run service (if it exists)
        run: |
          gcloud run services delete "$SERVICE_NAME" \
            --region="${{ secrets.GCP_REGION }}" \
            --quiet 2>/dev/null || echo "Service $SERVICE_NAME not found, nothing to clean up."

      - name: Delete container image (if it exists)
        run: |
          gcloud artifacts docker images delete \
            "${{ secrets.GCP_ARTIFACT_REGISTRY }}/editor:${{ env.IMAGE_TAG }}" \
            --delete-tags --quiet 2>/dev/null || echo "Image not found, nothing to clean up."
