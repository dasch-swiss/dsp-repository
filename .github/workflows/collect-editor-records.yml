name: Collect Editor Records

# Turns the editor's approved records into one pull request per project.
#
# Manual: no schedule and no editor-side webhook, because neither notifies
# anyone sooner than a person deciding to collect. Each record's outcome is a
# row in the run's job summary, and a failed record fails the run.
# `docs/src/editor/collection.md` is the contract this implements and wins on
# any difference.

on:
  workflow_dispatch:

# Any RDU member can fire this, so two runs can overlap. Queue rather than
# cancel: a cancelled run can stop between force-pushing a branch and rewriting
# its pull request's body, and the entity-id allocation is re-derived per
# record, not per run.
concurrency:
  group: collect-editor-records
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    name: Collect
    runs-on: ubuntu-latest
    if: github.repository_owner == 'dasch-swiss'
    steps:
      # Before checkout: a missing variable is a configuration failure, and
      # there is nothing to be gained from cloning first. GitHub substitutes an
      # empty string for an unset variable rather than failing the run.
      - name: Require the editor's base URL
        env:
          EDITOR_BASE_URL: ${{ vars.EDITOR_BASE_URL }}
        run: |
          if [ -z "$EDITOR_BASE_URL" ]; then
            echo "not configured: variable EDITOR_BASE_URL" >&2
            echo "See DEV-6921, which owns the editor hostname." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # Full history: the collector inspects each editor-collect/<shortcode>
          # branch tip to decide whether it made that commit, and refuses to
          # force-push over a reviewer's fixups.
          fetch-depth: 0
          # Not github.token. A pull request opened with GITHUB_TOKEN triggers no
          # workflows, so a collection pull request would arrive with no check,
          # no test and no commit-hygiene run — green because nothing ran.
          token: ${{ secrets.GH_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Identify the collector's commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Collect approved records
        env:
          EDITOR_BASE_URL: ${{ vars.EDITOR_BASE_URL }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          COLLECTOR_REPOSITORY: ${{ github.repository }}
        run: cargo run --release -p editor-collector
