name: Docker publish editor image

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build editor
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Compute image tag
        id: tag
        run: echo "tag=$(git describe --tags --match 'v*' | sed 's/^v//')" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/build-editor

      - uses: actions/upload-artifact@v4
        with:
          name: editor-build
          path: staging/
          retention-days: 1

  publish:
    name: Publish editor image
    runs-on: ubuntu-latest
    needs: build
    outputs:
      tag: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: editor-build
          path: staging/

      - uses: ./.github/actions/docker-publish
        with:
          context: staging/
          dockerfile: staging/Dockerfile
          tags: daschswiss/metadata-editor:${{ needs.build.outputs.tag }}
          docker-user: ${{ secrets.DOCKER_USER }}
          docker-hub-token: ${{ secrets.DOCKER_HUB_TOKEN }}

  trigger-dev-deployment:
    name: Trigger deployment to DEV
    runs-on: ubuntu-latest
    needs: publish
    # TOLERATED FAILURE, TO BE REMOVED. The editor is not registered as a
    # deployable service in Jenkins yet — that lands with the deployment work,
    # along with its inventory host and playbook. Until then the webhook rejects
    # `Service=editor`. The image is already published by the time this runs, so
    # a rejection must not turn the publish workflow red on main. Drop this line
    # once the Jenkins job exists, so a genuinely broken webhook is loud again.
    continue-on-error: true
    steps:
      - name: Trigger deployment to DEV
        env:
          IMAGE_TAG: ${{ needs.publish.outputs.tag }}
          JENKINS_BASIC_AUTH_USER: ${{ secrets.JENKINS_BASIC_AUTH_USER }}
          JENKINS_BASIC_AUTH_PASS: ${{ secrets.JENKINS_BASIC_AUTH_PASS }}
          JENKINS_UPDATE_RELEASE_WEBHOOK: ${{ secrets.JENKINS_UPDATE_REPOSITORY_DEV_WEBHOOK }}
        run: |
          if ! curl -f -u "${JENKINS_BASIC_AUTH_USER}:${JENKINS_BASIC_AUTH_PASS}" \
                    -X POST "${JENKINS_UPDATE_RELEASE_WEBHOOK}" \
                    -d "Service=editor&Version=${IMAGE_TAG}"; then
            echo "::warning title=Editor DEV deploy not triggered::Jenkins rejected Service=editor. The image daschswiss/metadata-editor:${IMAGE_TAG} published successfully, but no DEV deployment was triggered - the editor still needs its Jenkins job and inventory host."
            exit 1
          fi
