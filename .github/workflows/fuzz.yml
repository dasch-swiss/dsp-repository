name: Nightly Fuzz Testing

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - tab_validation
          - query_params

    steps:
      - uses: actions/checkout@v4

      - name: Bazel setup
        id: bazel
        uses: ./.github/actions/bazel-setup
        with:
          rbe-runner-endpoint: ${{ vars.REMOTEBUILD_RUNNER_ENDPOINT }}
          rbe-ca-cert: ${{ secrets.REMOTEBUILD_CA_CERT }}
          rbe-client-cert: ${{ secrets.REMOTEBUILD_CLIENT_CERT }}
          rbe-client-key: ${{ secrets.REMOTEBUILD_CLIENT_KEY }}

      - name: Build the fuzz binaries
        id: build
        # The recipe prints each binary's path under bazel-out/; `bazel-bin` follows whichever
        # configuration was built last, so it is not used.
        run: |
          bin="$(just build-fuzz ${{ steps.bazel.outputs.flags }} | grep '/${{ matrix.target }}_bin$')"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"

      - name: Restore corpus cache
        uses: actions/cache@v4
        with:
          path: areas/access/dpe/server/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Run fuzzer (10 min budget)
        # libFuzzer creates neither directory. A crash lands in artifacts/<target>/, the path the
        # upload below reads.
        run: |
          corpus=areas/access/dpe/server/fuzz/corpus/${{ matrix.target }}
          artifacts=areas/access/dpe/server/fuzz/artifacts/${{ matrix.target }}
          mkdir -p "$corpus" "$artifacts"
          "${{ steps.build.outputs.bin }}" "$corpus" \
            -artifact_prefix="$artifacts/" \
            -max_total_time=600 \
            -max_len=4096
        id: fuzz

      - name: Upload corpus as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: areas/access/dpe/server/fuzz/corpus/${{ matrix.target }}
          retention-days: 30

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: areas/access/dpe/server/fuzz/artifacts/${{ matrix.target }}
          retention-days: 90

      - name: Save Bazel repository cache
        if: ${{ !cancelled() && steps.bazel.outputs.repo-cache-key != '' && steps.bazel.outputs.repo-cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/bazel-repo
          key: ${{ steps.bazel.outputs.repo-cache-key }}
