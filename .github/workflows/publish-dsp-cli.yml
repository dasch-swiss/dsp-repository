# This workflow publishes dsp-cli to crates.io whenever a GitHub release is published.
# dsp-cli has its own release-please version line (see .github/release-please/config.json),
# so its releases are tagged `dsp-cli-vX.Y.Z` rather than the root's `vX.Y.Z` — the tag
# prefix is what distinguishes a dsp-cli release from a root release here.

name: Publish dsp-cli

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish dsp-cli to crates.io
    runs-on: ubuntu-latest
    if: startsWith(github.event.release.tag_name, 'dsp-cli-v')
    environment: crates-io
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo publish --dry-run
        run: cargo publish -p dsp-cli --dry-run --locked

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: cargo publish
        run: cargo publish -p dsp-cli --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
