name: Release Please

on:
  push:
    branches:
      - main

# Serialize runs: several pushes to main in quick succession each start a run,
# and they all force-push the same release-please branch. Without this guard the
# earlier runs lose the race and fail with "stale info" on --force-with-lease.
# Queue (don't cancel) so each run re-evaluates against the previous one's push.
concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    if: github.repository_owner == 'dasch-swiss'
    outputs:
      branches: ${{ steps.find-prs.outputs.branches }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GH_TOKEN }}
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json

      # Cargo.lock must be regenerated by Cargo after release-please bumps
      # the workspace version in Cargo.toml. The native cargo-workspace
      # plugin cannot handle version.workspace = true (#2111), so we use
      # release-type: simple and regenerate the lockfile ourselves.
      #
      # We collect every pending release branch (not just newly created ones)
      # because with separate-pull-requests there can be more than one open
      # release PR (root and dsp-cli each get their own).
      - name: Find release PR branches
        id: find-prs
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # Compact to one line: a multi-line GITHUB_OUTPUT value is invalid, and gh pretty-prints arrays.
          BRANCHES=$(gh pr list --repo "${{ github.repository }}" --label "autorelease: pending" --json headRefName --jq '[.[].headRefName]' | jq -c .)
          echo "branches=$BRANCHES" >> "$GITHUB_OUTPUT"

  amend-lockfile:
    name: Amend Cargo.lock on release PR
    needs: release-please
    if: needs.release-please.result == 'success' && needs.release-please.outputs.branches != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.release-please.outputs.branches) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          # Full history: the next step amends release-please's commit. A shallow
          # checkout (default depth 1) has no parent to amend onto, so the amend
          # becomes a parentless root commit, the force-push makes the branch
          # disjoint from main, and GitHub auto-closes the release PR.
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Update Cargo.lock on release PR
        run: |
          cargo update --workspace
          git diff --quiet Cargo.lock && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          # Amend release-please's commit instead of adding a second one, so the
          # release PR stays a single commit. With rebase-only merge this keeps
          # the release to one commit on main. --no-edit preserves the
          # "chore(main): release X.Y.Z" message that release-please matches on.
          git commit --amend --no-edit
          git push --force-with-lease
