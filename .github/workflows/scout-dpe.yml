name: Scout / DPE

on:
  pull_request:
    paths:
      - "areas/access/dpe/**"
      - "areas/access/server/**"
      - "areas/access/cpe/**"
      - "areas/access/sync/**"
      - "areas/access/media/**"
      - "shared/**"
      - "modules/mosaic/tiles/**"
      - ".github/actions/build-dpe/**"
      - ".github/actions/docker-scout/**"
      # The Bazel build: what it reads besides the sources above.
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - "Cargo.Bazel.lock"
      - ".bazelrc"
      - ".bazelversion"
      - "platforms/**"
      - "bazel/**"
      - "tools/**"
      - ".github/actions/bazel-setup/**"
      - ".github/actions/bazel-rbe/**"

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  scan:
    name: Docker Scout / DPE
    if: >-
      github.event.action != 'closed' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # Loads the image as local-scan/dpe:latest.
      - uses: ./.github/actions/build-dpe
        with:
          rbe-runner-endpoint: ${{ vars.REMOTEBUILD_RUNNER_ENDPOINT }}
          rbe-ca-cert: ${{ secrets.REMOTEBUILD_CA_CERT }}
          rbe-client-cert: ${{ secrets.REMOTEBUILD_CLIENT_CERT }}
          rbe-client-key: ${{ secrets.REMOTEBUILD_CLIENT_KEY }}

      - uses: ./.github/actions/docker-scout
        with:
          image: local://local-scan/dpe:latest
          sarif-file: scout-dpe.sarif
          sarif-category: docker-scout-dpe
          docker-user: ${{ secrets.DOCKER_USER }}
          docker-hub-token: ${{ secrets.DOCKER_HUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
