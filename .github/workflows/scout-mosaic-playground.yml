name: Scout / Mosaic Playground

on:
  pull_request:
    paths:
      - "modules/mosaic/**"
      - ".github/actions/docker-scout/**"
      # The Bazel build: what it reads besides the sources above.
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - "Cargo.Bazel.lock"
      - ".bazelrc"
      - ".bazelversion"
      - "platforms/**"
      - "bazel/**"
      - "tools/**"
      - ".github/actions/bazel-setup/**"
      - ".github/actions/bazel-rbe/**"

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  scan:
    name: Docker Scout / Mosaic Playground
    if: >-
      github.event.action != 'closed' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Bazel setup
        id: bazel
        uses: ./.github/actions/bazel-setup
        with:
          rbe-runner-endpoint: ${{ vars.REMOTEBUILD_RUNNER_ENDPOINT }}
          rbe-ca-cert: ${{ secrets.REMOTEBUILD_CA_CERT }}
          rbe-client-cert: ${{ secrets.REMOTEBUILD_CLIENT_CERT }}
          rbe-client-key: ${{ secrets.REMOTEBUILD_CLIENT_KEY }}

      # Loads the image as local-scan/mosaic-playground:latest.
      - name: just bazel-docker-build-mosaic
        run: just bazel-docker-build-mosaic ${{ steps.bazel.outputs.flags }}

      - name: Save Bazel repository cache
        if: ${{ !cancelled() && steps.bazel.outputs.repo-cache-key != '' && steps.bazel.outputs.repo-cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/bazel-repo
          key: ${{ steps.bazel.outputs.repo-cache-key }}

      - uses: ./.github/actions/docker-scout
        with:
          image: local://local-scan/mosaic-playground:latest
          sarif-file: scout-mosaic.sarif
          sarif-category: docker-scout-mosaic-playground
          docker-user: ${{ secrets.DOCKER_USER }}
          docker-hub-token: ${{ secrets.DOCKER_HUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
