name: test

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  required:
    runs-on: ubuntu-latest
    name: test / ubuntu / stable
    # Twice the slowest warm Bazel steps of this job in Phases 2 to 8 (tests and image smoke,
    # 571 s), plus the steps outside Bazel. A cold build (no remote cache: Dependabot, forks, the
    # endpoint down) takes longer.
    timeout-minutes: 21
    steps:
      - uses: actions/checkout@v4
      # The OAI tests shell out to xmllint; they are tagged `no-remote-exec` and run on this runner.
      - name: Install xmllint
        run: |
          sudo apt-get update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libxml2-utils
      - name: Bazel setup
        id: bazel
        uses: ./.github/actions/bazel-setup
        with:
          rbe-runner-endpoint: ${{ vars.REMOTEBUILD_RUNNER_ENDPOINT }}
          rbe-ca-cert: ${{ secrets.REMOTEBUILD_CA_CERT }}
          rbe-client-cert: ${{ secrets.REMOTEBUILD_CLIENT_CERT }}
          rbe-client-key: ${{ secrets.REMOTEBUILD_CLIENT_KEY }}
      - name: just test
        run: just test ${{ steps.bazel.outputs.flags }}
      # DPE's data and every committed CPE project, strictly (docs/src/cpe/operations.md).
      - name: just validate-cpe
        run: just validate-cpe ${{ steps.bazel.outputs.flags }}
      # The three images, built from the same commit, started and answering.
      - name: just image-smoke
        run: just image-smoke ${{ steps.bazel.outputs.flags }}
      - name: Save Bazel repository cache
        if: ${{ !cancelled() && steps.bazel.outputs.repo-cache-key != '' && steps.bazel.outputs.repo-cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/bazel-repo
          key: ${{ steps.bazel.outputs.repo-cache-key }}

  scripts:
    runs-on: ubuntu-latest
    name: test / scripts
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install just
        uses: extractions/setup-just@v4
      - name: just test-scripts
        run: just test-scripts
