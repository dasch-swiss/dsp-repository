[package]
name = "access-server"
version.workspace = true
edition = "2021"
publish = false

[[bin]]
name = "access-server"
path = "src/main.rs"

[features]
# Dev-loop live-reload for DPE (`dpe-server/dev`): browser auto-refresh on server restart +
# asset changes. Enabled by the dev loop (bacon.toml / `just dev`); never in release builds.
dev = ["dpe-server/dev"]

[dependencies]
cpe-ports = { path = "../cpe/ports" }
cpe-server = { path = "../cpe/server" }
dpe-server = { path = "../dpe/server" }
media-store = { path = "../media/store" }
sync-store = { path = "../sync/store" }
shared-telemetry = { path = "../../../shared/telemetry" }

axum.workspace = true
clap = { version = "4", features = ["derive"] }
ureq = "3"
tokio.workspace = true
tower = { workspace = true, features = ["util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
axum-tracing-opentelemetry.workspace = true
init-tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry-appender-tracing.workspace = true
pyroscope.workspace = true
tower_governor.workspace = true

[dev-dependencies]
tempfile = "3"
