[package]
name = "editor-pull-requests"
version.workspace = true
edition = "2021"
publish = false

[[bin]]
name = "editor-pull-requests"
path = "src/main.rs"

[dependencies]
# The editor's own wire types and canonical writers. Consuming them rather than
# mirroring them is what keeps the pull-request run and the editor from drifting on the
# payload shape, and what keeps one implementation of the canonical form —
# `docs/src/editor/publishing-to-git.md` requires both.
editor-core = { path = "../core" }
shared-metadata = { path = "../../../../shared/metadata" }
serde.workspace = true
serde_json.workspace = true
# Blocking client: the pull-request run is a batch CLI with no concurrency, so an async
# runtime would buy nothing. `rustls` avoids an OpenSSL build dependency, as in
# `dsp-cli`.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }

[dev-dependencies]
# Named only from tests, which build a record by hand; the production path
# reaches both types through `editor-core`.
chrono.workspace = true
uuid.workspace = true

