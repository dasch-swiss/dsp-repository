[package]
name = "identity-core"
version.workspace = true
edition = "2021"
publish = false

[dependencies]
# Identity's domain: accounts, sessions, login codes and the persistence ports
# behind them. No Axum, Maud, rusqlite or deadpool here, and no `editor-core` or
# `editor-web`: the SQLite implementations live in `identity-store`, the HTTP
# surface in `identity-web`, and identity must stay usable without any editor
# concept.
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
# CSPRNG for the login code and the opaque tokens.
rand = "0.9"
# Constant-time comparison of the submitted code against the stored one.
subtle = "2.6"
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
