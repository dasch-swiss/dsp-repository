# bacon config for the dev loops. `serve` is the area binary, DPE and CPE (`just dev` / `just dev-otel`);
# `serve-editor` is the metadata editor (`just dev-editor` / `just dev-editor-otel`).

default_job = "serve"

[jobs.check]
command = ["cargo", "check", "--all-targets", "--color", "always"]
need_stdout = false

[jobs.serve]
command = ["cargo", "run", "--bin", "access-server", "--features", "dev", "--", "serve"]
need_stdout = true
background = false
on_change_strategy = "kill_then_restart"
# Graceful SIGINT so the server releases its port before restart.
kill = ["kill", "-s", "INT"]
# Also watch the composition root, CPE, `sync`, the tiles crate and the
# `shared-*` crates, so changes in any of them rebuild — none lives under
# `areas/access/dpe`.
watch = [
  "areas/access/dpe",
  "areas/access/server",
  "areas/access/cpe",
  "areas/access/sync",
  "shared",
  "modules/mosaic/tiles/src",
]
# CPE is mounted only with a base.
env = { CPE_BASE = "/cpe" }

[jobs.serve-editor]
command = ["cargo", "run", "--bin", "editor-server", "--", "serve"]
need_stdout = true
background = false
on_change_strategy = "kill_then_restart"
# Graceful SIGINT so the server releases its port before restart.
kill = ["kill", "-s", "INT"]
# Also watch identity's crates, the area shell, the tiles crate and the `shared-*`
# crates, so changes in any of them rebuild — none lives under `areas/deposit/editor`.
watch = ["areas/deposit/editor", "areas/deposit/identity", "areas/deposit/shell", "shared", "modules/mosaic/tiles/src"]
