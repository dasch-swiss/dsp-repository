# bacon config for the dev loops. `serve` is DPE (`just dev` / `just dev-otel`);
# `serve-editor` is the metadata editor (`just dev-editor` / `just dev-editor-otel`).

default_job = "serve"

[jobs.check]
command = ["cargo", "check", "--all-targets", "--color", "always"]
need_stdout = false

[jobs.serve]
command = ["cargo", "run", "--bin", "dpe-server", "--features", "dev", "--", "serve"]
need_stdout = true
background = false
on_change_strategy = "kill_then_restart"
# Graceful SIGINT so the server releases its port before restart.
kill = ["kill", "-s", "INT"]
# Also watch the tiles crate so tile changes rebuild.
watch = ["modules/dpe", "modules/mosaic/tiles/src"]

[jobs.serve-editor]
command = ["cargo", "run", "--bin", "editor-server", "--", "serve"]
need_stdout = true
background = false
on_change_strategy = "kill_then_restart"
# Graceful SIGINT so the server releases its port before restart.
kill = ["kill", "-s", "INT"]
# Also watch the tiles crate so tile changes rebuild.
watch = ["modules/editor", "modules/mosaic/tiles/src"]
